<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desert Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1510;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8dcc8;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .controls {
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .game-wrap {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
    }
    #gaugeCanvas {
      display: block;
      border: 3px solid #8b7355;
      border-right: none;
      border-radius: 4px 0 0 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #1a1510;
    }
    #gameCanvas {
      display: block;
      border: 3px solid #8b7355;
      border-radius: 0 4px 4px 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #c4a574;
      cursor: none;
    }
  </style>
</head>
<body>
  <h1>Desert Drive</h1>
  <p class="controls">Arrow keys or WASD: steer · Up/W: forward, Down/S: reverse (stop first) · Space: brake to stop</p>
  <div class="game-wrap">
    <canvas id="gaugeCanvas" width="140" height="700"></canvas>
    <canvas id="gameCanvas" width="700" height="700"></canvas>
  </div>

  <script>
    (function () {
      const gameCanvas = document.getElementById('gameCanvas');
      const gaugeCanvas = document.getElementById('gaugeCanvas');
      const ctx = gameCanvas.getContext('2d');
      const gaugeCtx = gaugeCanvas.getContext('2d');
      const GAME_SIZE = 700;

      // Car state
      const car = {
        x: GAME_SIZE / 2,
        y: GAME_SIZE / 2,
        angle: 0,           // radians, 0 = right
        speed: 0,            // pixels per frame (can be negative = reverse)
        maxSpeed: 4.5,
        acceleration: 0.07,
        deceleration: 0.12,
        turnRate: 0.045,     // radians per frame when moving
        friction: 0.98,
        width: 24,
        length: 40,
      };

      // Fuel: 1 tank lasts 10 s at top speed, 40 s at 50% speed (consumption ∝ speed²)
      let fuel = 1.0;
      const fuelMax = 1.0;
      let lastFuelRatePerSec = 0;      // instantaneous fuel use (fraction of tank per second)
      const fuelRateMaxPerSec = 0.05;   // used only for BURN gauge scale (1–100%)
      const rangeAt100BurnPixels = 6400; // at 100% burn a full tank lasts this many pixels; at 80% → 8000, at 40% → 16000

      // Drivetrain / engine
      const idleRpm = 1000;
      const redlineRpm = 6250;   // natural limit when off throttle; throttle can push to maxRpm
      const maxRpm = 7500;       // gauge 0–7500; throttle held allows rev to 7500 and speed beyond 150
      const downshiftRpm = 2500;
      const lowFuelRpmCap = 3500;   // low fuel: limit to 40% burn rpm, shift at this until 5th
      const neutralGear = 0;
      const minGear = 1;
      const maxGear = 5;
      let currentGear = neutralGear;
      let engineRpm = idleRpm;
      // Per-gear forward speed caps (pixels per frame)

      // Engine sound (Web Audio), init on load and resume on first interaction
      let audioCtx = null;
      let engineOsc1 = null;
      let engineOsc2 = null;
      let engineGain = null;
      let engineFilter = null;

      function initEngineSound() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc1 = audioCtx.createOscillator();
        engineOsc2 = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineFilter = audioCtx.createBiquadFilter();
        engineFilter.type = 'lowpass';
        engineFilter.frequency.value = 1200;
        engineFilter.Q.value = 1;
        engineOsc1.type = 'sawtooth';
        engineOsc2.type = 'sawtooth';
        engineOsc2.detune.value = -5;
        engineOsc1.connect(engineFilter);
        engineOsc2.connect(engineFilter);
        engineFilter.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineGain.gain.value = 0.06;
        engineOsc1.start(0);
        engineOsc2.start(0);
        if (audioCtx.state === 'suspended') audioCtx.resume().then(() => {}).catch(() => {});
      }

      function tryStartEngineSound() {
        initEngineSound();
        if (!audioCtx || !engineGain) return;
        const startEngine = () => {
          if (engineGain && fuel > 0.001) {
            engineGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.05);
            engineStarted = true;
          }
        };
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(startEngine).catch(() => {});
        } else {
          startEngine();
        }
      }

      let lastRefuelBeepTile = null; // "x,y" of tile we last beeped on
      function playRefuelBeep() {
        if (!audioCtx) initEngineSound();
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const t = audioCtx.currentTime;
        const dur = 0.12;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.2, t);
        g.gain.setValueAtTime(0, t + dur);
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.linearRampToValueAtTime(1100, t + dur);
        osc.type = 'sine';
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function updateEngineSound(rpm, speed) {
        if (!engineOsc1 || !engineGain) return;
        const rpmClamp = Math.max(idleRpm, Math.min(maxRpm, rpm));
        const freq = 50 + (rpmClamp - idleRpm) / (maxRpm - idleRpm) * 280;
        engineOsc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.02);
        engineOsc2.frequency.setTargetAtTime(freq * 0.5, audioCtx.currentTime, 0.02);
        const engineAudible = fuel > 0.001 || Math.abs(speed) >= 0.02;
        const vol = engineAudible ? 0.06 + 0.04 * (rpmClamp - idleRpm) / (maxRpm - idleRpm) : 0;
        engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
      }
      // At 6250 rpm: 1st=50, 2nd=75, 3rd=100, 4th=125, 5th=150 (speedometer scale 0–150)
      const gearMaxSpeeds = [0, 1.5, 2.25, 3.0, 3.75, 4.5];
      const gearAccelMultipliers = [0, 1, 0.67, 0.5, 0.4, 0.33];

      // Input state
      const keys = {
        up: false,
        down: false,
        left: false,
        right: false,
        brake: false,
      };

      // Must release gas after stopping before reverse/forward can engage
      let needReleaseBeforeReverse = false;
      let needReleaseBeforeForward = false;

      // Map bounds and desert scroll (car stays on screen; world moves)
      const MAP_SIZE = 6000;
      const WALL_THICKNESS = 20;
      let offsetX = -MAP_SIZE / 2;
      let offsetY = -MAP_SIZE / 2;
      const sandTileSize = 48;
      let totalPixelsDriven = 0;
      let carHasMoved = false;
      let engineStarted = false;
      let throttleDelayRemaining = 0;
      const throttleDelaySec = 0.5;

      const gaugePad = 15;
      const gaugeR = 49;
      const gaugeStep = 98;
      const gaugeBg = '#000000';
      const gaugeTrack = '#333333';
      const gaugeGreen = '#00e676';
      const gaugeYellow = '#ffd600';
      const gaugeRed = '#ff5252';
      const gaugeText = '#ffffff';

      let engineTemp = 0;
      const tempMin = 0;
      const tempMax = 180;
      const tempRpmRiseThreshold = 6250;   // above this (constant speed): temp rises
      const tempRpmStableLow = 5000;       // 5000–6250 (constant speed): temp stable
      const tempRpmFallThreshold = 5000;   // below this (constant speed): temp drops
      const tempRiseRatePerSec = 20;       // temp rise rate (accelerating or high rpm)
      const tempDropRatePerSec = tempRiseRatePerSec / 2;  // drop twice as slow as rise
      const overheatTempEnter = 135;       // must stay above this for 5 s to trigger limp
      const overheatTempExit = 135;        // temp < this: exit overheat limp (can accelerate again)
      const overheatRpmCap = 3500;         // limp: decel to 3500 rpm in gear, no accel above that
      const overheatDelaySec = 5;         // seconds above 135 before anything happens
      let overheatMode = false;           // true only after 5+ s above 135, until temp < 135
      let overheatTimerSec = 0;

      function isRefuelTile(worldTileX, worldTileY) {
        return (Math.abs(worldTileX * 31 + worldTileY * 17) % 127 === 0);
      }

      function drawDesert() {
        // Single desert color background (game area only)
        ctx.fillStyle = '#cda96b';
        ctx.fillRect(0, 0, GAME_SIZE, GAME_SIZE);

        const cx = GAME_SIZE / 2;
        const cy = GAME_SIZE / 2;

        // Black walls at map edges (20px thick)
        ctx.fillStyle = '#000000';
        ctx.fillRect(cx + offsetX, cy + offsetY, WALL_THICKNESS, MAP_SIZE);
        ctx.fillRect(cx + offsetX + MAP_SIZE - WALL_THICKNESS, cy + offsetY, WALL_THICKNESS, MAP_SIZE);
        ctx.fillRect(cx + offsetX, cy + offsetY, MAP_SIZE, WALL_THICKNESS);
        ctx.fillRect(cx + offsetX, cy + offsetY + MAP_SIZE - WALL_THICKNESS, MAP_SIZE, WALL_THICKNESS);

        // Random 4×4 black reference dots in world space (deterministic). Preload margin so dots exist before they enter view.
        const dotCellSize = 48;
        const dotSize = 4;
        const dotPreloadMargin = 500;
        const minWorldX = -offsetX - dotPreloadMargin;
        const maxWorldX = -offsetX + GAME_SIZE + dotPreloadMargin;
        const minWorldY = -offsetY - dotPreloadMargin;
        const maxWorldY = -offsetY + GAME_SIZE + dotPreloadMargin;
        const cellMinX = Math.floor(minWorldX / dotCellSize);
        const cellMaxX = Math.ceil(maxWorldX / dotCellSize);
        const cellMinY = Math.floor(minWorldY / dotCellSize);
        const cellMaxY = Math.ceil(maxWorldY / dotCellSize);
        const screenMargin = dotPreloadMargin;
        ctx.fillStyle = '#000000';
        for (let cellY = cellMinY; cellY <= cellMaxY; cellY++) {
          for (let cellX = cellMinX; cellX <= cellMaxX; cellX++) {
            const h = (cellX * 31 + cellY * 17) % 97;
            if (h >= 45) continue;
            const ox = (cellX * 7 + cellY * 13) % Math.max(1, dotCellSize - dotSize);
            const oy = (cellX * 11 + cellY * 19) % Math.max(1, dotCellSize - dotSize);
            const wx = cellX * dotCellSize + ox;
            const wy = cellY * dotCellSize + oy;
            if (wx < WALL_THICKNESS || wx > MAP_SIZE - WALL_THICKNESS || wy < WALL_THICKNESS || wy > MAP_SIZE - WALL_THICKNESS) continue;
            const sx = cx + wx + offsetX;
            const sy = cy + wy + offsetY;
            if (sx < -screenMargin || sx > GAME_SIZE + screenMargin || sy < -screenMargin || sy > GAME_SIZE + screenMargin) continue;
            ctx.fillRect(sx, sy, dotSize, dotSize);
          }
        }

        // Rare elliptical reference spots in world space (deterministic, preloaded like dots)
        const ellipseCellSize = 320;
        const ellipsePreloadMargin = 120;
        const ellMinX = -offsetX - ellipsePreloadMargin;
        const ellMaxX = -offsetX + GAME_SIZE + ellipsePreloadMargin;
        const ellMinY = -offsetY - ellipsePreloadMargin;
        const ellMaxY = -offsetY + GAME_SIZE + ellipsePreloadMargin;
        const ellCellMinX = Math.floor(ellMinX / ellipseCellSize);
        const ellCellMaxX = Math.ceil(ellMaxX / ellipseCellSize);
        const ellCellMinY = Math.floor(ellMinY / ellipseCellSize);
        const ellCellMaxY = Math.ceil(ellMaxY / ellipseCellSize);
        ctx.fillStyle = 'rgba(140, 100, 50, 0.55)';
        for (let ey = ellCellMinY; ey <= ellCellMaxY; ey++) {
          for (let ex = ellCellMinX; ex <= ellCellMaxX; ex++) {
            const eh = (ex * 41 + ey * 23) % 127;
            if (eh !== 0) continue;
            const eox = (ex * 19 + ey * 7) % Math.max(1, ellipseCellSize - 80);
            const eoy = (ex * 13 + ey * 29) % Math.max(1, ellipseCellSize - 80);
            const ewx = ex * ellipseCellSize + eox;
            const ewy = ey * ellipseCellSize + eoy;
            if (ewx < WALL_THICKNESS || ewx > MAP_SIZE - WALL_THICKNESS || ewy < WALL_THICKNESS || ewy > MAP_SIZE - WALL_THICKNESS) continue;
            const esx = cx + ewx + offsetX;
            const esy = cy + ewy + offsetY;
            if (esx < -80 || esx > GAME_SIZE + 80 || esy < -80 || esy > GAME_SIZE + 80) continue;
            ctx.beginPath();
            ctx.ellipse(esx, esy, 70, 22, 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Fuel stations: gas-pump symbol, aligned with refuel grid (rare)
        const baseTileX = Math.floor(-offsetX / sandTileSize);
        const baseTileY = Math.floor(-offsetY / sandTileSize);
        for (let gy = baseTileY - 10; gy <= baseTileY + 10; gy++) {
          for (let gx = baseTileX - 12; gx <= baseTileX + 12; gx++) {
            if (!isRefuelTile(gx, gy)) continue;
            const worldX = gx * sandTileSize;
            const worldY = gy * sandTileSize;
            const sx = cx + worldX + offsetX;
            const sy = cy + worldY + offsetY;
            if (sx < -50 || sx > GAME_SIZE + 50 || sy < -50 || sy > GAME_SIZE + 50) continue;
            ctx.save();
            ctx.translate(sx, sy);
            // Base circle
            ctx.fillStyle = '#e8d4b8';
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Gas pump symbol: circle (top), stem, nozzle (right)
            ctx.fillStyle = '#2d5016';
            ctx.strokeStyle = '#1a3010';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, -10, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillRect(-2.5, -4, 5, 14);
            ctx.fillRect(2.5, 4, 10, 5);
            ctx.beginPath();
            ctx.arc(14, 6.5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      function drawCar() {
        const cx = GAME_SIZE / 2;
        const cy = GAME_SIZE / 2;

        ctx.save();
        ctx.translate(cx, cy);
        // Align car so angle 0 = facing right (movement direction matches drawing)
        ctx.rotate(car.angle - Math.PI / 2);

        // Body (rounded rect)
        const w = car.width / 2;
        const h = car.length / 2;
        ctx.fillStyle = '#2d5016';
        ctx.beginPath();
        ctx.roundRect(-w, -h, car.width, car.length, 6);
        ctx.fill();
        ctx.strokeStyle = '#1a3010';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Windshield (front)
        ctx.fillStyle = 'rgba(120, 180, 220, 0.6)';
        ctx.beginPath();
        ctx.moveTo(-w * 0.6, h * 0.3);
        ctx.lineTo(w * 0.6, h * 0.3);
        ctx.lineTo(w * 0.5, h);
        ctx.lineTo(-w * 0.5, h);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#1a3010';
        ctx.stroke();

        // Rear (slightly darker)
        ctx.fillStyle = '#223d12';
        ctx.beginPath();
        ctx.moveTo(-w * 0.5, -h);
        ctx.lineTo(w * 0.5, -h);
        ctx.lineTo(w * 0.6, -h * 0.3);
        ctx.lineTo(-w * 0.6, -h * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Wheels (simple rectangles)
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-w - 2, -h + 4, 4, 12);
        ctx.fillRect(w - 2, -h + 4, 4, 12);
        ctx.fillRect(-w - 2, h - 16, 4, 12);
        ctx.fillRect(w - 2, h - 16, 4, 12);

        ctx.restore();
      }

      function drawPixelsGauge() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r + gaugeStep * 5;
        const g = gaugeCtx;

        g.fillStyle = gaugeBg;
        g.strokeStyle = gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;
        g.strokeStyle = gaugeTrack;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('KM', cx, cy - 18);

        g.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
        g.textBaseline = 'middle';
        const tensOfPixels = carHasMoved ? Math.min(99999, Math.floor(totalPixelsDriven / 10)) : 0;
        const str = tensOfPixels.toString().padStart(5, '0');
        const totalW = g.measureText(str).width;
        const restW = g.measureText(str.slice(0, -1)).width;
        g.textAlign = 'left';
        g.fillStyle = gaugeText;
        g.fillText(str.slice(0, -1), cx - totalW / 2, cy + 4);
        g.fillStyle = gaugeRed;
        g.fillText(str.slice(-1), cx - totalW / 2 + restW, cy + 4);
        g.textAlign = 'center';
      }

      function drawSpeedo() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r + gaugeStep * 2;
        const g = gaugeCtx;

        const speedometerMax = 180;
        const speedNorm = carHasMoved ? Math.min(speedometerMax, (Math.abs(car.speed) / car.maxSpeed) * 150) : 0;
        const isReverse = carHasMoved && car.speed < -0.05;

        g.fillStyle = gaugeBg;
        g.strokeStyle = gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;

        g.strokeStyle = gaugeTrack;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        g.strokeStyle = isReverse ? gaugeYellow : gaugeGreen;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeStart + (speedNorm / speedometerMax) * gaugeSweep);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('SPEED', cx, cy - 18);

        g.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = gaugeText;
        g.fillText(Math.round(speedNorm).toString(), cx, cy);
      }

      function drawFuelGauge() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r + gaugeStep * 3;
        const g = gaugeCtx;

        const fuelPct = carHasMoved ? Math.max(0, Math.min(100, (fuel / fuelMax) * 100)) : 0;
        const lowFuel = carHasMoved && fuelPct <= 15;
        const flashPhase = lowFuel && (Date.now() / 350 % 2 < 1);

        g.fillStyle = flashPhase ? gaugeRed : gaugeBg;
        g.strokeStyle = flashPhase ? gaugeRed : gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;

        g.strokeStyle = flashPhase ? '#662222' : gaugeTrack;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        g.strokeStyle = !carHasMoved ? gaugeTrack : (fuelPct > 30 ? gaugeGreen : (fuelPct > 15 ? gaugeYellow : gaugeRed));
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeStart + (fuelPct / 100) * gaugeSweep);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('FUEL', cx, cy - 18);

        g.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = flashPhase ? gaugeText : (!carHasMoved ? gaugeText : (fuelPct > 30 ? gaugeGreen : (fuelPct > 15 ? gaugeYellow : gaugeRed)));
        g.fillText(Math.round(fuelPct) + '%', cx, cy + 4);
      }

      function drawFuelRateGauge() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r + gaugeStep * 4;
        const g = gaugeCtx;

        const hasFuel = fuel > 0.001;
        const rawRatio = carHasMoved ? Math.max(0, Math.min(1, lastFuelRatePerSec / fuelRateMaxPerSec)) : 0;
        const rateRatio = engineStarted && !carHasMoved ? 1/99 : (carHasMoved && hasFuel ? Math.max(0, Math.min(1, (rawRatio - 0.01) / 0.99)) : 0);
        const ratePct = engineStarted && !carHasMoved ? 1 : (carHasMoved && hasFuel ? Math.max(1, Math.min(100, 1 + (rawRatio - 0.01) / 0.99 * 99)) : 0);

        g.fillStyle = gaugeBg;
        g.strokeStyle = gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;

        g.strokeStyle = gaugeTrack;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        g.strokeStyle = ratePct > 75 ? gaugeRed : (ratePct > 40 ? gaugeYellow : gaugeGreen);
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeStart + rateRatio * gaugeSweep);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('BURN', cx, cy - 18);

        g.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
        g.textBaseline = 'middle';
        g.fillStyle = gaugeText;
        g.fillText(Math.round(ratePct) + '%', cx, cy + 4);
      }

      function drawRpmGauge() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r;
        const g = gaugeCtx;

        const rpm = engineStarted && !carHasMoved ? idleRpm : (carHasMoved ? Math.max(0, Math.min(maxRpm, engineRpm)) : 0);
        const rpmNorm = rpm / maxRpm;

        g.fillStyle = gaugeBg;
        g.strokeStyle = gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;

        g.strokeStyle = gaugeTrack;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        let fillColor = gaugeGreen;
        if (rpm >= 6251) fillColor = gaugeRed;
        else if (rpm >= 5001) fillColor = gaugeYellow;
        g.strokeStyle = fillColor;
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeStart + rpmNorm * gaugeSweep);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('RPM', cx, cy - 18);

        g.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
        g.textBaseline = 'middle';
        g.fillStyle = gaugeText;
        g.fillText(Math.round(rpm).toString(), cx, cy);

        const gearLabel = !carHasMoved ? 'N' : (car.speed < -0.05 ? 'R' : (currentGear === neutralGear ? 'N' : String(currentGear)));
        g.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = car.speed < -0.05 ? gaugeYellow : gaugeText;
        g.fillText(gearLabel, cx, cy + 22);
      }

      function drawTempGauge() {
        const r = gaugeR;
        const cx = gaugePad + r;
        const cy = gaugePad + r + gaugeStep;
        const g = gaugeCtx;

        const flashPhase = overheatMode && (Date.now() / 350 % 2 < 1);
        g.fillStyle = flashPhase ? gaugeRed : gaugeBg;
        g.strokeStyle = flashPhase ? gaugeRed : gaugeTrack;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const gaugeBase = Math.PI / 2;
        const gaugeStart = gaugeBase + (45 * Math.PI) / 180;
        const gaugeEnd = gaugeBase + (315 * Math.PI) / 180;
        const gaugeSweep = gaugeEnd - gaugeStart;

        g.lineWidth = 6;
        g.strokeStyle = flashPhase ? '#662222' : gaugeTrack;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, gaugeEnd);
        g.stroke();

        const tempClamp = carHasMoved ? Math.max(0, Math.min(tempMax, engineTemp)) : 0;
        const tempFrac = tempClamp / tempMax;
        const fillEnd = gaugeStart + tempFrac * gaugeSweep;

        const fillColor = tempClamp <= 90 ? gaugeGreen : (tempClamp <= 135 ? gaugeYellow : gaugeRed);
        g.strokeStyle = flashPhase ? gaugeText : fillColor;
        g.beginPath();
        g.arc(cx, cy, r - 8, gaugeStart, fillEnd);
        g.stroke();

        g.font = '10px "Segoe UI", system-ui, sans-serif';
        g.fillStyle = gaugeText;
        g.textAlign = 'center';
        g.fillText('TEMP', cx, cy - 18);

        g.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = gaugeText;
        g.fillText(Math.round(engineTemp).toString(), cx, cy + 4);
      }

      function update(dt) {
        const rate = Math.min(dt / 16, 2);

        const speedRatio = Math.abs(car.speed) / car.maxSpeed;
        const hasFuel = fuel > 0.001;
        const lowFuel = hasFuel && (fuel / fuelMax) <= 0.15;

        // Refuel when driving over a pink tile; short beep once per tile visit
        const carTileX = Math.floor(-offsetX / sandTileSize);
        const carTileY = Math.floor(-offsetY / sandTileSize);
        if (isRefuelTile(carTileX, carTileY)) {
          fuel = fuelMax;
          const tileKey = carTileX + ',' + carTileY;
          if (lastRefuelBeepTile !== tileKey) {
            lastRefuelBeepTile = tileKey;
            playRefuelBeep();
          }
        } else {
          lastRefuelBeepTile = null;
        }

        // Neutral gear behaviour
        // When fully stopped and no throttle, fall back to N
        if (Math.abs(car.speed) < 0.02 && !keys.up && !keys.down) {
          car.speed = 0;
          if (car.speed >= 0) currentGear = neutralGear;
        }
        // At start: idle for half a second after first pressing throttle before car responds
        if (!carHasMoved && (keys.up || keys.down) && throttleDelayRemaining <= 0) throttleDelayRemaining = throttleDelaySec;
        if (throttleDelayRemaining > 0) throttleDelayRemaining -= dt / 1000;
        const throttleAllowed = throttleDelayRemaining <= 0;

        // From N, pressing forward with fuel engages 1st gear (after throttle delay at start)
        if (currentGear === neutralGear && keys.up && hasFuel && !needReleaseBeforeForward && !overheatMode && throttleAllowed) {
          currentGear = 1;
        }

        // Track that we were moving so we require "release then press again" to switch direction
        if (car.speed > 0.05) needReleaseBeforeReverse = true;
        if (car.speed < -0.05) needReleaseBeforeForward = true;

        // Acceleration / deceleration: must stop, release key, then press again to reverse or go forward; no accel when out of fuel. In overheat, accelerator does nothing.
        if (keys.up && throttleAllowed && !overheatMode) {
          if (car.speed < 0) {
            car.speed = Math.min(car.speed + car.acceleration * rate, 0);
          } else if (car.speed >= 0 && !needReleaseBeforeForward && hasFuel && !overheatMode) {
            const gearMax = gearMaxSpeeds[currentGear];
            const gearMaxAt7500 = gearMax * (maxRpm / redlineRpm);
            const gearAccel = car.acceleration * gearAccelMultipliers[currentGear] * (lowFuel ? 0.5 : 1);
            const speedFrac = gearMaxAt7500 > 0 ? car.speed / gearMaxAt7500 : 0;
            const speedFactor = Math.max(0.25, 1 - 0.75 * speedFrac);
            car.speed = Math.min(car.speed + gearAccel * speedFactor * rate, gearMaxAt7500);
          } else if (car.speed >= 0 && !hasFuel) {
            car.speed = Math.max(0, car.speed - car.acceleration * rate);
          } else {
            car.speed = 0;
          }
        }
        if (keys.down && throttleAllowed && !overheatMode) {
          if (car.speed > 0) {
            car.speed = Math.max(car.speed - car.acceleration * rate, 0);
          } else if (car.speed <= 0 && !needReleaseBeforeReverse && hasFuel && !overheatMode) {
            const revAccel = car.acceleration * (lowFuel ? 0.5 : 1);
            car.speed = Math.max(car.speed - revAccel * rate, -car.maxSpeed * 0.2);
          } else if (car.speed <= 0 && !hasFuel) {
            car.speed = Math.min(0, car.speed + car.acceleration * rate);
          } else {
            car.speed = 0;
          }
        }
        // Out of fuel: lose power and slowly decelerate to a stop
        if (!hasFuel && Math.abs(car.speed) > 0.005) {
          car.speed *= Math.pow(0.985, rate);
          if (Math.abs(car.speed) < 0.005) car.speed = 0;
        }
        // Overheat limp (only after 5 s above 135): decelerate to 3500 rpm in current gear (same gentle rate as out of fuel)
        // Skip entirely when braking so the brake (applied below) can slow the car below 3500 and to stop
        if (overheatMode && !keys.brake && Math.abs(car.speed) > 0.005) {
          const rpmFrac = (overheatRpmCap - idleRpm) / (redlineRpm - idleRpm);
          let targetSpeed;
          if (car.speed > 0) {
            const gearMax = gearMaxSpeeds[currentGear];
            targetSpeed = gearMax > 0 ? gearMax * rpmFrac : 0;
            car.speed *= Math.pow(0.985, rate);
            if (car.speed < targetSpeed) car.speed = targetSpeed;
          } else {
            targetSpeed = -(rpmFrac * 30 * car.maxSpeed / 150);
            car.speed *= Math.pow(0.985, rate);
            if (car.speed < targetSpeed) car.speed = targetSpeed;
          }
          if (Math.abs(car.speed) < 0.005) car.speed = 0;
        }
        // Brake always runs last so it can slow the car below overheat target (and to stop) regardless of overheat
        if (keys.brake) {
          car.speed *= Math.pow(0.88, rate);
          if (Math.abs(car.speed) < 0.03) car.speed = 0;
        }

        // Engine RPM: forward gears, reverse (6250 at reverse speed 30), or idle
        const forwardSpeed = Math.max(0, car.speed);
        if (car.speed < -0.01) {
          const reverseSpeedNorm = (Math.abs(car.speed) / car.maxSpeed) * 150;
          engineRpm = idleRpm + (reverseSpeedNorm / 30) * (redlineRpm - idleRpm);
        } else if (forwardSpeed < 0.01) {
          const throttleForward = keys.up && hasFuel && !needReleaseBeforeForward;
          engineRpm = throttleForward ? redlineRpm * 0.6 : idleRpm;
        } else {
          const gearMax = gearMaxSpeeds[currentGear];
          const throttleHeld = keys.up && hasFuel && !needReleaseBeforeForward;
          const gearMaxForRpm = throttleHeld ? gearMax * (maxRpm / redlineRpm) : gearMax;
          const speedFrac = gearMaxForRpm > 0 ? Math.min(1, forwardSpeed / gearMaxForRpm) : 0;
          engineRpm = throttleHeld
            ? idleRpm + speedFrac * (maxRpm - idleRpm)
            : idleRpm + speedFrac * (redlineRpm - idleRpm);
        }
        engineRpm = Math.max(idleRpm, Math.min(maxRpm, engineRpm));
        if (!hasFuel && Math.abs(car.speed) < 0.02) engineRpm = 0;
        // Overheat: don't cap RPM so it drops with speed; acceleration is still blocked so rpm will fall to 3500 as car slows

        const tempFloor = hasFuel ? (engineTemp >= 60 ? 60 : engineTemp) : 0;
        const accelerating = (keys.up && car.speed > 0.02 && hasFuel) || (keys.down && car.speed < -0.02 && hasFuel);
        // When accelerating: instantly 83% unless rpm > 6250 (then 83–100% by rpm). When not: 1% at idle, 83% at 6250, 100% at 7500.
        let burnRatio;
        if (accelerating) {
          if (engineRpm <= redlineRpm) {
            burnRatio = 0.83;
          } else {
            burnRatio = 0.83 + (engineRpm - redlineRpm) / (maxRpm - redlineRpm) * (1 - 0.83);
          }
        } else {
          if (engineRpm <= redlineRpm) {
            burnRatio = 0.01 + (engineRpm - idleRpm) / (redlineRpm - idleRpm) * (0.83 - 0.01);
          } else {
            burnRatio = 0.83 + (engineRpm - redlineRpm) / (maxRpm - redlineRpm) * (1 - 0.83);
          }
        }
        burnRatio = Math.max(0.01, Math.min(1, burnRatio));
        if (overheatMode) burnRatio = Math.min(burnRatio, 0.40);
        // Fuel by distance: at 100% burn range = rangeAt100BurnPixels; at 40% burn range is 2.5× that
        const pixelsThisFrame = Math.abs(car.speed * rate);
        const fuelPerPixel = (fuelMax / rangeAt100BurnPixels) * burnRatio * (lowFuel ? 0.5 : 1);
        fuel -= fuelPerPixel * pixelsThisFrame;
        fuel = Math.max(0, fuel);
        lastFuelRatePerSec = fuelRateMaxPerSec * burnRatio * (lowFuel ? 0.5 : 1); // for BURN gauge 1–100%

        const decelerating = keys.brake || (car.speed > 0.02 && !keys.up) || (car.speed < -0.02 && !keys.down);
        // In overheat (temp flashing), accelerator must not affect temp — only allow drops while it is cooling
        if (accelerating && !overheatMode) {
          engineTemp = Math.min(tempMax, engineTemp + tempRiseRatePerSec * (dt / 1000));
        } else if (decelerating && engineRpm < tempRpmFallThreshold) {
          engineTemp = Math.max(tempFloor, engineTemp - tempDropRatePerSec * (dt / 1000));
        } else if (!decelerating && !overheatMode) {
          if (engineRpm > tempRpmRiseThreshold) {
            engineTemp = Math.min(tempMax, engineTemp + ((engineRpm - tempRpmRiseThreshold) / 1000) * (tempRiseRatePerSec * 0.6) * (dt / 1000));
          } else if (engineRpm < tempRpmFallThreshold) {
            engineTemp = Math.max(tempFloor, engineTemp - ((tempRpmFallThreshold - engineRpm) / tempRpmFallThreshold) * (tempDropRatePerSec * 0.6) * (dt / 1000));
          }
        } else if (!decelerating && overheatMode && engineRpm < tempRpmFallThreshold) {
          engineTemp = Math.max(tempFloor, engineTemp - ((tempRpmFallThreshold - engineRpm) / tempRpmFallThreshold) * (tempDropRatePerSec * 0.6) * (dt / 1000));
        }
        if (engineTemp > overheatTempEnter) {
          overheatTimerSec += dt / 1000;
          if (overheatTimerSec >= overheatDelaySec) overheatMode = true;
        } else {
          overheatTimerSec = 0;
          if (engineTemp < overheatTempExit) overheatMode = false;
        }

        // Auto shift up/down when not in reverse and not in neutral (low fuel: shift at 3500 rpm until 5th)
        const shiftUpRpm = lowFuel ? lowFuelRpmCap : redlineRpm;
        if (forwardSpeed > 0.1 && currentGear > neutralGear) {
          if (engineRpm >= shiftUpRpm && currentGear < maxGear) {
            currentGear += 1;
          } else if (engineRpm <= downshiftRpm && currentGear > minGear) {
            currentGear -= 1;
          }
        }

        // Low fuel: cap speed at 40% burn rpm (3500) in current gear
        if (lowFuel && Math.abs(car.speed) > 0.005) {
          const rpmFrac40 = (lowFuelRpmCap - idleRpm) / (redlineRpm - idleRpm);
          if (car.speed > 0) {
            const gearMax = gearMaxSpeeds[currentGear];
            const cap = gearMax > 0 ? gearMax * rpmFrac40 : 0;
            if (car.speed > cap) car.speed = cap;
          } else {
            const capReverse = -(rpmFrac40 * 30 * car.maxSpeed / 150);
            if (car.speed < capReverse) car.speed = capReverse;
          }
        }

        // When throttle released and above 6250-rpm speed: slowly decay toward 6250 (rpm and speed drop together)
        if (car.speed > 0 && !keys.up && hasFuel && !overheatMode && currentGear > neutralGear) {
          const gearMax = gearMaxSpeeds[currentGear];
          if (car.speed > gearMax) {
            car.speed *= Math.pow(0.985, rate);
            if (car.speed < gearMax) car.speed = gearMax;
          }
        }
        // Hard cap at extended gear max when throttle held (already limited in accel block)
        if (car.speed > 0 && currentGear > neutralGear) {
          const gearMax = gearMaxSpeeds[currentGear];
          const gearMaxAt7500 = gearMax * (maxRpm / redlineRpm);
          if (car.speed > gearMaxAt7500) car.speed = gearMaxAt7500;
        }

        // Steering: rotation changes which direction the car is moving toward
        const turn = car.turnRate * rate;
        if (keys.left)  car.angle -= turn * (Math.abs(car.speed) > 0.1 ? 1 : 0.7);
        if (keys.right) car.angle += turn * (Math.abs(car.speed) > 0.1 ? 1 : 0.7);

        // Move in world (car stays on screen; world moves)
        const move = car.speed * rate;
        offsetX -= Math.cos(car.angle) * move;
        offsetY -= Math.sin(car.angle) * move;
        // Walls (20px thick): reflect at inner edge so car stays in playable area
        let carWorldX = -offsetX;
        let carWorldY = -offsetY;
        if (carWorldX < WALL_THICKNESS) {
          offsetX = -WALL_THICKNESS;
          car.angle = Math.PI - car.angle;
        } else if (carWorldX > MAP_SIZE - WALL_THICKNESS) {
          offsetX = -(MAP_SIZE - WALL_THICKNESS);
          car.angle = Math.PI - car.angle;
        }
        carWorldX = -offsetX;
        carWorldY = -offsetY;
        if (carWorldY < WALL_THICKNESS) {
          offsetY = -WALL_THICKNESS;
          car.angle = -car.angle;
        } else if (carWorldY > MAP_SIZE - WALL_THICKNESS) {
          offsetY = -(MAP_SIZE - WALL_THICKNESS);
          car.angle = -car.angle;
        }
        while (car.angle > Math.PI) car.angle -= 2 * Math.PI;
        while (car.angle < -Math.PI) car.angle += 2 * Math.PI;
        totalPixelsDriven += Math.abs(move);
        if (totalPixelsDriven > 0) carHasMoved = true;
      }

      function gameLoop(t) {
        const dt = t - (gameLoop.last || t);
        gameLoop.last = t;
        update(dt);
        updateEngineSound(engineRpm, car.speed);
        drawDesert();
        drawCar();
        drawRpmGauge();
        drawTempGauge();
        drawSpeedo();
        drawFuelGauge();
        drawFuelRateGauge();
        drawPixelsGauge();
        requestAnimationFrame(gameLoop);
      }

      initEngineSound();
      document.addEventListener('click', tryStartEngineSound, { once: true });
      document.addEventListener('touchstart', tryStartEngineSound, { once: true, passive: true });
      document.addEventListener('keydown', (e) => {
        tryStartEngineSound();
        switch (e.key) {
          case 'ArrowUp': case 'w': case 'W': keys.up = true; e.preventDefault(); break;
          case 'ArrowDown': case 's': case 'S': keys.down = true; e.preventDefault(); break;
          case 'ArrowLeft': case 'a': case 'A': keys.left = true; e.preventDefault(); break;
          case 'ArrowRight': case 'd': case 'D': keys.right = true; e.preventDefault(); break;
          case ' ': keys.brake = true; e.preventDefault(); break;
        }
      });
      document.addEventListener('keyup', (e) => {
        switch (e.key) {
          case 'ArrowUp': case 'w': case 'W': keys.up = false; needReleaseBeforeForward = false; break;
          case 'ArrowDown': case 's': case 'S': keys.down = false; needReleaseBeforeReverse = false; break;
          case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
          case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
          case ' ': keys.brake = false; break;
        }
      });

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
